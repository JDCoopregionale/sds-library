<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --border: #dedad2;
    --text: #211f1a; --text-muted: #6b6559; --accent: #3f6b3f; --accent-hover: #325632;
    --accent-text: #ffffff; --danger: #a13d3d;

    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17160f; --surface: #211f18; --surface-2: #2a281f; --border: #3a3729;
      --text: #f0ede4; --text-muted: #a8a190; --accent: #6a9c5f; --accent-hover: #7db072;
      --accent-text: #12160e; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 12px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17160f; --surface: #211f18; --surface-2: #2a281f; --border: #3a3729;
    --text: #f0ede4; --text-muted: #a8a190; --accent: #6a9c5f; --accent-hover: #7db072;
    --accent-text: #12160e; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 12px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.4; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top h1 { font-size: 1.5rem; margin: 0; }
  header.top .sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    font-size: 0.9rem; font-weight: 500; text-decoration: none; transition: background .12s ease; }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.95rem; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-size: 0.8rem; cursor: pointer; color: var(--text-muted); }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .count { color: var(--text-muted); font-size: 0.85rem; margin: 4px 0 14px; }
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
  .card-main { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
  .tag { display: inline-block; margin-top: 6px; font-size: 0.72rem; font-weight: 600; padding: 3px 8px;
    border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .02em; }
  .tag.herbicide { background: var(--tag-herbicide); }
  .tag.fungicide { background: var(--tag-fungicide); }
  .tag.insecticide { background: var(--tag-insecticide); }
  .tag.other { background: var(--tag-other); }
  .card-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .empty { text-align: center; color: var(--text-muted); padding: 50px 20px; }
  .master-box { display: flex; align-items: center; gap: 16px; background: var(--surface-2);
    border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 22px; max-width: 420px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
  .modal h2 { margin-top: 0; font-size: 1.1rem; }
  .modal .close-x { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }
  .qr-result { text-align: center; padding: 10px 0; }
  .qr-result svg { width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 8px; }
  .qr-result .name { font-weight: 600; margin: 10px 0 4px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* passcode gate */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; z-index: 100; padding: 20px; }
  #gate.hidden { display: none; }
  .gate-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 24px; max-width: 320px; width: 100%; text-align: center; box-shadow: var(--shadow); }
  .gate-box h2 { margin-top: 0; font-size: 1.15rem; }
  .gate-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 18px; }
  .gate-box input { width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 1rem; text-align: center; letter-spacing: .05em;
    margin-bottom: 10px; }
  .gate-box .err { color: var(--danger); font-size: 0.82rem; min-height: 18px; margin-bottom: 6px; }
  #appRoot { display: none; }
  #appRoot.shown { display: block; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>🔒 SDS Library</h2>
    <p>Enter the access code to continue.</p>
    <input type="password" id="gateInput" placeholder="Access code" autocomplete="off" inputmode="text">
    <div class="err" id="gateErr"></div>
    <button class="btn btn-primary" id="gateSubmit" style="width:100%;">Enter</button>
  </div>
</div>

<div id="appRoot">
<div class="wrap">
  <header class="top">
    <div>
      <h1>SDS Library</h1>
      <div class="sub">Scan a product's QR code, or search below.</div>
    </div>
    <button class="btn" id="masterQrBtn">📋 Master QR</button>
  </header>

  <div class="toolbar">
    <input class="search" id="searchInput" type="text" placeholder="Search chemical name…">
  </div>
  <div class="chips" id="categoryChips"></div>
  <div class="count" id="countLine"></div>

  <div class="card-list" id="cardList"></div>
  <div class="empty" id="emptyState" style="display:none;">No chemicals match that search.</div>
</div>
</div>

<div class="overlay" id="qrOverlay">
  <div class="modal">
    <button class="close-x" data-close="qrOverlay">✕</button>
    <div class="qr-result">
      <div id="qrHolder"></div>
      <div class="name" id="qrName"></div>
      <div style="font-size:0.8rem;color:var(--text-muted);">Print and attach to the product.</div>
    </div>
    <div class="modal-actions">
      <a class="btn" id="qrDownload" download>⬇ Download SVG</a>
      <a class="btn btn-primary" id="qrOpenPdf" target="_blank" rel="noopener">Open SDS</a>
    </div>
  </div>
</div>

<div class="overlay" id="masterOverlay">
  <div class="modal">
    <button class="close-x" data-close="masterOverlay">✕</button>
    <div class="qr-result">
      <div id="masterQrHolder"></div>
      <div class="name">Full Library</div>
      <div style="font-size:0.8rem;color:var(--text-muted);">Post this where the old binder used to live.</div>
    </div>
    <div class="modal-actions">
      <a class="btn btn-primary" id="masterDownload" download>⬇ Download SVG</a>
    </div>
  </div>
</div>

<script>
/* ---- Access code gate ----
   Client-side only: a deterrent against casual/public/scraper access, not
   full security. Change ACCESS_HASH by hashing a new code (see README). */
const ACCESS_HASH = "5cc9efd64593db439aedb90a418a91b1fc28bf835fbcc5101bcfc0f3a3bd822f";

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryUnlock(code) {
  const h = await sha256(code.trim());
  return h === ACCESS_HASH;
}

(async function initGate() {
  const stored = localStorage.getItem('sds_unlocked');
  if (stored === ACCESS_HASH) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('appRoot').classList.add('shown');
    initApp();
    return;
  }
  document.getElementById('gateSubmit').addEventListener('click', submitGate);
  document.getElementById('gateInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGate(); });
  async function submitGate() {
    const code = document.getElementById('gateInput').value;
    const err = document.getElementById('gateErr');
    if (await tryUnlock(code)) {
      const h = await sha256(code.trim());
      localStorage.setItem('sds_unlocked', h);
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('appRoot').classList.add('shown');
      initApp();
    } else {
      err.textContent = 'Incorrect code.';
      document.getElementById('gateInput').value = '';
    }
  }
})();

function initApp() {
  let activeCategory = 'All';
  function el(id) { return document.getElementById(id); }
  function openOv(id) { el(id).classList.add('open'); }
  function closeOv(id) { el(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeOv(b.getAttribute('data-close'))));
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', (e) => { if (e.target === o) o.classList.remove('open'); }));

  function tagClass(cat) {
    const c = (cat || '').toLowerCase();
    if (c === 'herbicide') return 'herbicide';
    if (c === 'fungicide') return 'fungicide';
    if (c === 'insecticide') return 'insecticide';
    return 'other';
  }
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function makeQrSvg(text, size) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: size || 5, margin: 2 });
  }
  function svgToDataUrl(svg) {
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }
  function absoluteUrl(relPath) {
    const base = window.location.href.split('?')[0].replace(/[^/]*$/, '');
    return base + relPath;
  }
  function sanitizeFilename(s) {
    return (s || 'product').replace(/[^a-z0-9\-_]+/gi, '-').replace(/-+/g, '-').slice(0, 60);
  }

  function render() {
    const q = (el('searchInput').value || '').toLowerCase().trim();
    const list = PRODUCTS.filter(p => {
      const matchesQ = !q || (p.name || '').toLowerCase().includes(q);
      const matchesCat = activeCategory === 'All' || p.category === activeCategory;
      return matchesQ && matchesCat;
    }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    el('countLine').textContent = list.length + (list.length === 1 ? ' chemical' : ' chemicals');
    el('cardList').innerHTML = '';
    el('emptyState').style.display = list.length ? 'none' : 'block';

    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-main">
          <div class="card-name">${escapeHtml(p.name)}</div>
          <span class="tag ${tagClass(p.category)}">${escapeHtml(p.category || 'Other')}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-sm" data-action="qr" data-id="${p.id}">QR</button>
          <a class="btn btn-sm btn-primary" href="${p.file}" target="_blank" rel="noopener">View</a>
        </div>
      `;
      el('cardList').appendChild(card);
    });
    el('cardList').querySelectorAll('[data-action="qr"]').forEach(btn => {
      btn.addEventListener('click', () => showProductQr(btn.getAttribute('data-id')));
    });
    renderChips();
  }

  function renderChips() {
    const cats = ['All', ...new Set(PRODUCTS.map(p => p.category || 'Other'))];
    el('categoryChips').innerHTML = '';
    cats.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (c === activeCategory ? ' active' : '');
      chip.textContent = c;
      chip.addEventListener('click', () => { activeCategory = c; render(); });
      el('categoryChips').appendChild(chip);
    });
  }

  function showProductQr(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
    const url = absoluteUrl(p.file);
    const svg = makeQrSvg(url, 6);
    el('qrHolder').innerHTML = svg;
    el('qrName').textContent = p.name;
    el('qrOpenPdf').href = p.file;
    el('qrDownload').href = svgToDataUrl(svg);
    el('qrDownload').setAttribute('download', sanitizeFilename(p.name) + '-qr.svg');
    openOv('qrOverlay');
  }

  el('masterQrBtn').addEventListener('click', () => {
    const url = window.location.href.split('?')[0];
    const svg = makeQrSvg(url, 6);
    el('masterQrHolder').innerHTML = svg;
    el('masterDownload').href = svgToDataUrl(svg);
    el('masterDownload').setAttribute('download', 'sds-library-qr.svg');
    openOv('masterOverlay');
  });

  el('searchInput').addEventListener('input', render);
  render();
}
</script>
